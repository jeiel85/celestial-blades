<svg xmlns="http://www.w3.org/2000/svg" width="88" height="72" viewBox="0 0 88 72">
  <!-- 려화: 붉은 법의 화염 술사. 넓은 소매, 머리 장식, 앞으로 펼친 부채 -->
  <defs>
    <linearGradient id="robe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7b2d"/>
      <stop offset="0.55" stop-color="#e63b2e"/>
      <stop offset="1" stop-color="#7a1e0e"/>
    </linearGradient>
    <linearGradient id="sleeve" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#c33d1e"/>
      <stop offset="1" stop-color="#5a160e"/>
    </linearGradient>
    <radialGradient id="fan" cx="0" cy="0.5" r="1">
      <stop offset="0" stop-color="#fff2c0"/>
      <stop offset="0.5" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ff7b2d"/>
    </radialGradient>
    <radialGradient id="flame" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff2c0" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#ff7b2d" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#e63b2e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- 뒤로 흐르는 불꽃 잔광 -->
  <ellipse cx="14" cy="44" rx="13" ry="9" fill="url(#flame)"/>
  <g stroke="#3d1408" stroke-width="1.6" stroke-linejoin="round">
    <!-- 휘날리는 소매/치맛자락 -->
    <path d="M34 38 C24 32 14 30 4 22 C8 32 10 38 6 44 C14 44 22 46 30 50 Z" fill="url(#sleeve)"/>
    <path d="M32 52 C22 52 14 56 4 62 C14 64 24 66 38 60 Z" fill="#7a1e0e"/>
    <!-- 몸통 법의 -->
    <path d="M30 36 Q34 31 42 31 L52 33 Q57 37 55 46 L52 58 Q44 62 34 59 Q28 48 30 36 Z" fill="url(#robe)"/>
    <path d="M42 32 L48 46 L44 58" fill="none" stroke="#ffd75e" stroke-width="1.6"/>
    <path d="M31 48 L54 50" stroke="#ffd75e" stroke-width="2.6"/>
    <!-- 긴 머리 -->
    <path d="M40 18 C34 22 30 30 22 34 C30 36 38 32 44 28 Z" fill="#5a160e"/>
    <!-- 머리 -->
    <circle cx="49" cy="23" r="10.5" fill="#ffe6cc"/>
    <path d="M38.5 23 C38 13 46 10 53 11 C59 12 61 16 60 19 L52 18 C49 21 46 24 42 27 Z" fill="#5a160e"/>
    <!-- 머리 장식 (불꽃 비녀) -->
    <path d="M47 11 L50 3 L53 10 L57 5 L56 13 Z" fill="#ffd75e"/>
    <circle cx="51" cy="12" r="2.6" fill="#e63b2e"/>
    <!-- 팔 -->
    <path d="M48 38 L59 35 L61 40 L50 43 Z" fill="#c33d1e"/>
    <!-- 부채 -->
    <path d="M60 37 L83 14 Q90 36 83 58 Z" fill="url(#fan)"/>
  </g>
  <g stroke="#7a1e0e" stroke-width="1.2" fill="none">
    <path d="M60 37 L85 22"/><path d="M60 37 L87 31"/><path d="M60 37 L87 42"/><path d="M60 37 L85 51"/>
  </g>
  <circle cx="60" cy="37" r="2.6" fill="#fff2c0" stroke="#3d1408" stroke-width="1.2"/>
  <!-- 눈 -->
  <path d="M53.5 22.5 Q55.5 21 57.5 22.5" stroke="#3d1408" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <circle cx="56" cy="27.5" r="1.4" fill="#ff7b7b" opacity="0.7"/>
</svg>
