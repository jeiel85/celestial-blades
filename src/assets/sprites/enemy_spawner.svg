<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 60 60">
  <!-- 소환형: 비취색 요괴 둥지. 4개의 소환 구멍과 중앙의 큰 눈 -->
  <defs>
    <radialGradient id="shell" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#5ec79a"/>
      <stop offset="0.7" stop-color="#2e6e4d"/>
      <stop offset="1" stop-color="#0f2418"/>
    </radialGradient>
    <radialGradient id="hole" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b8ffe6"/>
      <stop offset="0.4" stop-color="#53e0b0"/>
      <stop offset="1" stop-color="#0a1a10"/>
    </radialGradient>
    <radialGradient id="eye" cx="0.45" cy="0.4" r="0.6">
