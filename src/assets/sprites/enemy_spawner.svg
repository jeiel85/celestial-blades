  <g stroke="#08150d" stroke-width="1.2">
    <circle cx="18" cy="18" r="6.5" fill="url(#hole)"/><circle cx="42" cy="18" r="6.5" fill="url(#hole)"/>
    <circle cx="18" cy="42" r="6.5" fill="url(#hole)"/><circle cx="42" cy="42" r="6.5" fill="url(#hole)"/>
  </g>
  <circle cx="30" cy="30" r="9.5" fill="url(#eye)" stroke="#08150d" stroke-width="1.4"/>
  <ellipse cx="28" cy="30" rx="3" ry="6" fill="#0a1a10"/>
  <circle cx="27" cy="27.5" r="1.2" fill="#ffffff"/>
