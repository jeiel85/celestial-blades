<svg xmlns="http://www.w3.org/2000/svg" width="88" height="72" viewBox="0 0 88 72">
  <!-- 무영: 후드 암살자. 길게 늘어진 보랏빛 스카프, 쌍단검, 낮게 숙인 돌진 자세 -->
  <defs>
    <linearGradient id="scarf" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#a06bff"/>
      <stop offset="1" stop-color="#3d2a6e" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b3fa8"/>
      <stop offset="1" stop-color="#1e1440"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c8c8dc"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <g stroke="#0c0820" stroke-width="1.6" stroke-linejoin="round">
    <!-- 스카프 두 갈래 -->
    <path d="M40 26 C30 22 18 18 2 20 C12 24 18 26 8 32 C20 32 30 32 40 32 Z" fill="url(#scarf)"/>
    <path d="M38 30 C28 34 18 40 6 40 C14 44 24 42 38 36 Z" fill="#5b3fa8" opacity="0.9"/>
    <!-- 다리 (뒤로 뻗음) -->
    <path d="M32 50 L14 56 L16 60 L34 56 Z" fill="#1e1440"/>
    <path d="M38 54 L22 64 L25 67 L42 58 Z" fill="#2a1e5e"/>
    <!-- 몸통 -->
    <path d="M30 38 Q34 32 44 32 L54 36 Q56 44 52 52 Q44 58 34 55 Q28 48 30 38 Z" fill="url(#body)"/>
    <path d="M36 44 L52 42" stroke="#a06bff" stroke-width="1.4"/>
    <!-- 후드 -->
    <path d="M36 28 C36 16 44 9 54 10 C62 11 66 18 64 28 L58 32 L42 33 Z" fill="#2a1e5e"/>
    <path d="M44 16 C48 12 56 12 60 16" fill="none" stroke="#7a5ccf" stroke-width="1.2"/>
    <!-- 얼굴 그늘 + 마스크 -->
    <path d="M50 18 L63 19 L63 30 L50 30 Z" fill="#14102a"/>
    <path d="M50 25 L63 25 L62 30 L50 30 Z" fill="#3d2a6e"/>
    <!-- 팔 -->
    <path d="M48 38 L60 34 L61 39 L50 43 Z" fill="#3d2a6e"/>
    <path d="M46 46 L58 46 L58 51 L46 51 Z" fill="#2a1e5e"/>
  </g>
  <g stroke="#0c0820" stroke-width="1.3" stroke-linejoin="round">
    <!-- 단검 두 자루 -->
    <path d="M62 33 L87 33 L62 39 Z" fill="url(#steel)"/>
    <path d="M60 46 L84 54 L59 51 Z" fill="url(#steel)"/>
    <rect x="58" y="33" width="4" height="6" rx="1" fill="#ffd75e"/>
    <rect x="56" y="45.5" width="4" height="6" rx="1" fill="#ffd75e"/>
  </g>
  <!-- 빛나는 눈 -->
  <rect x="56" y="21" width="5" height="2.4" rx="1" fill="#d8c8ff"/>
  <rect x="58.5" y="21.3" width="1.6" height="1.4" fill="#ffffff"/>
  <!-- 속도선 -->
  <g stroke="#a06bff" stroke-width="1.2" opacity="0.55" stroke-linecap="round">
    <path d="M4 48 L18 48"/><path d="M8 53 L20 53"/>
  </g>
</svg>
