<svg xmlns="http://www.w3.org/2000/svg" width="88" height="72" viewBox="0 0 88 72">
  <!-- 윤: 청색 갑주 검사. 오른쪽을 향한 비행 자세, 뒤로 흐르는 망토와 머리끈 -->
  <defs>
    <linearGradient id="cape" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d2a52"/>
      <stop offset="1" stop-color="#2d7fd6"/>
    </linearGradient>
    <linearGradient id="armor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc8ff"/>
      <stop offset="0.5" stop-color="#2d7fd6"/>
      <stop offset="1" stop-color="#173f78"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9fe0ff"/>
    </linearGradient>
    <radialGradient id="bladeGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9fe0ff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#9fe0ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g stroke="#081321" stroke-width="1.6" stroke-linejoin="round">
    <!-- 망토 -->
    <path d="M36 32 C24 30 14 26 3 30 C10 36 8 42 2 47 C12 47 14 54 9 62 C20 58 28 56 36 54 Z" fill="url(#cape)"/>
    <path d="M30 36 C22 36 16 36 10 39" fill="none" stroke="#7cc8ff" stroke-width="1" opacity="0.6"/>
    <!-- 다리 -->
    <path d="M30 52 L20 60 L24 64 L36 57 Z" fill="#10233d"/>
    <path d="M38 55 L32 66 L37 68 L44 57 Z" fill="#173f78"/>
    <!-- 몸통 갑주 -->
    <path d="M30 36 Q32 31 40 31 L52 32 Q57 34 56 42 L54 54 Q50 58 40 57 L32 55 Q28 46 30 36 Z" fill="url(#armor)"/>
    <path d="M32 47 L54 48 L53 52 L32 51 Z" fill="#ffd75e"/>
    <path d="M38 33 L50 34 L46 44 Z" fill="#c8ecff" stroke="none" opacity="0.7"/>
    <!-- 머리끈 (뒤로 흩날림) -->
    <path d="M42 18 C34 14 26 16 18 12 C24 18 30 20 40 22 Z" fill="#4db2ff"/>
    <!-- 머리 -->
    <circle cx="49" cy="23" r="11" fill="#ffe0c2"/>
    <path d="M38 22 C38 12 46 9 54 11 C60 13 61 18 60 20 L50 19 L46 26 L40 28 Z" fill="#14233d"/>
    <path d="M44 15 L58 17" stroke="#4db2ff" stroke-width="2.4" fill="none"/>
    <!-- 팔 + 검 -->
    <path d="M48 38 L60 36 L61 41 L49 43 Z" fill="#2d7fd6"/>
  </g>
  <ellipse cx="74" cy="38" rx="15" ry="7" fill="url(#bladeGlow)"/>
  <g stroke="#081321" stroke-width="1.4" stroke-linejoin="round">
    <rect x="58" y="34.5" width="4" height="8" rx="1" fill="#ffd75e"/>
    <path d="M62 35.5 L85 38 L62 41 Z" fill="url(#blade)"/>
  </g>
  <!-- 눈 -->
  <rect x="54" y="21.5" width="3" height="4" rx="1" fill="#0d1c33"/>
  <rect x="54.5" y="22" width="1.2" height="1.4" fill="#ffffff"/>
  <path d="M51 29 Q54 30 57 28" stroke="#c48a6a" stroke-width="1" fill="none"/>
</svg>
