name: Supabase keep-alive

# 무료 플랜 Supabase 프로젝트는 7일간 요청이 없으면 일시정지된다(랭킹이 '불러오지 못함'이 됨).
# 사흘마다 랭킹 조회를 한 번 보내 깨워 둔다. 응답이 2xx가 아니면 실패로 표시해 알림을 받는다.
# 참고: GitHub은 저장소 활동이 60일 없으면 예약 워크플로를 자동으로 끈다(Actions 탭에서 다시 켜야 함).

on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # 브라우저 번들에도 들어 있는 공개용 publishable 키(src/game/systems/RankingService.ts와 같음)
      SUPABASE_URL: https://zexxkfjmyayyuewqkxee.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_nWVKphXlj57jNhS_-Vyfeg_F-3_6a9D
    steps:
      - name: Ping ranking API
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 20 \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            "$SUPABASE_URL/rest/v1/scores?select=id&limit=1")
          echo "HTTP $code"
          test "$code" -ge 200 -a "$code" -lt 300
